<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>簡易チャットクライアント</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 1em; }
    #chat-log { border: 1px solid #ccc; padding: 1em; height: 300px; overflow-y: auto; white-space: pre-wrap; background: #f9f9f9; }
    #input-area { margin-top: 1em; }
    #message { width: 80%; padding: 0.5em; }
    #send-btn { padding: 0.5em 1em; }
  </style>
</head>
<body>

<h2>簡易チャット</h2>
<div id="chat-log"></div>

<div id="input-area">
  <input type="text" id="message" placeholder="メッセージを入力してください" autocomplete="off" />
  <button id="send-btn">送信</button>
</div>

<!-- JavaScriptを外部ファイルとして読み込み -->
<script src="chat.js"></script>

</body>
</html>
