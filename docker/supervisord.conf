[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log

[program:backend]
command=python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000
directory=/app
user=root
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log
environment=DATABASE_URL="postgresql://mailagent_user:mailagent_password@localhost:5432/mailagent_db"

[program:frontend]
command=node /app/frontend/.next/standalone/server.js
directory=/app/frontend
user=root
autostart=true
autorestart=true
priority=30
startsecs=15
startretries=5
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend_err.log
environment=PORT="3000",HOSTNAME="0.0.0.0"
