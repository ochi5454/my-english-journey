# Alembic Configuration
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend revision.down() with DROP statements
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename
timezone = Asia/Tokyo

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Revision environment
revision_environment = false

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# sourceless = false

# Version path separator
version_path_separator = os  # default: use os.pathsep

# Output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# SQLAlchemy URL (will be overridden by env.py from Settings)
sqlalchemy.url = sqlite:///./data/app.db


[post_write_hooks]
# Post revision hooks (optional)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
