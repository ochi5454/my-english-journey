function getWeekKey(d) { const dt=new Date(d),day=dt.getDay(),diff=dt.getDate()-day+(day===0?-6:1),m=new Date(dt.setDate(diff)); return m.toISOString().slice(0,10); }
function getMonthKey(d) { return d.slice(0,7); }
function getYearKey(d) { return d.slice(0,4); }
function groupLogs(logs, fn) { return logs.reduce((acc,l)=>{ const k=fn(l.date); acc[k]=acc[k]||[]; acc[k].push(l); return acc; },{}); }

function SubjectBreakdown({ logs }) {
  const allSubs = Object.entries(GOALS).flatMap(([cat,{color,subs}])=>Object.keys(subs).map(s=>({cat,s,color})));
  const total = totalMin(logs);
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:8, marginTop:10 }}>
      {allSubs.map(({s,color})=>{
        const m=logs.filter(l=>l.subject===s).reduce((a,l)=>a+l.minutes,0);
        if(!m) return null;
        return (
          <div key={s}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"rgba(255,255,255,0.45)", marginBottom:3 }}>
              <span>{s}</span><span>{fmtH(m)} · {total>0?((m/total)*100).toFixed(0):0}%</span>
            </div>
            <Bar pct={total>0?(m/total)*100:0} color={color} h={2}/>
          </div>
        );
      })}
    </div>
  );
}

            {s}<span style={{ fontSize:9, marginLeft:4, opacity:0.5 }}>{goal}h</span>

      <FieldLabel style={{marginTop:18}}>メモ（任意）</FieldLabel>
      <input type="text" value={fNote} onChange={e=>setFNote(e.target.value)} placeholder="例: 単語帳100個" style={iStyle}/>
      <div style={{ display:"flex", gap:10, marginTop:28 }}>
        {onCancel && <button onClick={onCancel} style={{ flex:1, padding:"15px", background:"transparent", color:"rgba(255,255,255,0.4)", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:14, fontWeight:700, cursor:"pointer" }}>キャンセル</button>}
        <button onClick={handleSubmit} style={{ flex:2, padding:"15px", background:GOLD, color:"#000", border:"none", borderRadius:8, fontSize:14, fontWeight:800, cursor:"pointer", letterSpacing:"0.06em" }}>{submitLabel} →</button>

}

function PageProgress({ logs }) {
  const totalMins = totalMin(logs);
  const pct = (totalMins / 60 / GRAND_TOTAL) * 100;
  return (
    <div style={{ padding:"32px 20px" }}>
      <div style={{ fontSize:10, letterSpacing:"0.15em", color:GOLD, fontWeight:700, marginBottom:12 }}>PROGRESS</div>
      <h2 style={{ fontSize:24, fontWeight:800, color:"white", margin:"0 0 20px", letterSpacing:"-0.02em" }}>学習進捗</h2>
      <div style={{ borderRadius:14, overflow:"hidden", marginBottom:16 }}>
        <FujiScene pct={pct}/>
        <div style={{ display:"flex", borderTop:`1px solid ${BORDER}`, background:"#111" }}>
          {[["WALKED",(totalMins/60).toFixed(1)+"h"],["PROGRESS",pct.toFixed(1)+"%"],["REMAINING",Math.max(0,GRAND_TOTAL-totalMins/60).toFixed(1)+"h"]].map(([label,val],i)=>(
            <div key={label} style={{ flex:1, padding:"12px 10px", textAlign:"center", borderRight:i<2?`1px solid ${BORDER}`:"none" }}>
              <div style={{ fontSize:8, color:"rgba(255,255,255,0.25)", letterSpacing:"0.1em", marginBottom:4 }}>{label}</div>
              <div style={{ fontSize:16, fontWeight:800, color:i===0?GOLD:i===1?"white":"rgba(255,255,255,0.35)" }}>{val}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ padding:"11px 14px", background:"rgba(201,168,76,0.07)", border:`1px solid rgba(201,168,76,0.18)`, borderRadius:8, display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
        <div style={{ fontSize:10, color:"rgba(255,255,255,0.35)" }}>次のマイルストーン</div>
        <div style={{ fontSize:13, fontWeight:700, color:GOLD }}>
          {(function(){ const h=totalMins/60; const next=Math.ceil((h+0.01)/100)*100; return next>GRAND_TOTAL?"🏁 GOAL達成！":next+"h まで あと "+Math.max(0,next-h).toFixed(1)+"h"; })()}
        </div>
      </div>
      {Object.entries(GOALS).map(([cat,{total,color,subs}])=>{
        const catMins=Object.keys(subs).reduce((a,s)=>a+sumBy(logs,cat,s),0);
        const catH=catMins/60;
        return (
          <div key={cat} style={{ border:`1px solid ${BORDER}`, borderRadius:12, padding:"18px 16px", marginBottom:12 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div><Tag color={color}>{cat}</Tag><div style={{ fontSize:18, fontWeight:800, color:"white", marginTop:6 }}>{fmtH(catMins)} <span style={{ fontSize:12, color:"rgba(255,255,255,0.3)", fontWeight:400 }}>/ {total}h</span></div></div>
              <div style={{ fontSize:26, fontWeight:800, color:color }}>{((catH/total)*100).toFixed(0)}<span style={{ fontSize:11 }}>%</span></div>
            </div>
            <Bar pct={(catH/total)*100} color={color} h={4}/>
            <div style={{ marginTop:14, display:"flex", flexDirection:"column", gap:10 }}>
              {Object.entries(subs).map(([sub,goal])=>{
                const sm=sumBy(logs,cat,sub),sh=sm/60,sp=(sh/goal)*100;
                return (
                  <div key={sub}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"rgba(255,255,255,0.4)", marginBottom:4 }}><span>{sub}</span><span>{fmtH(sm)} / {goal}h · {sp.toFixed(0)}%</span></div>
                    <Bar pct={sp} color={sp>0?color:"#222"} h={2}/>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PageRecord({ logs, setLogs }) {
  const [toast, setToast] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [deleteId, setDeleteId] = useState(null);
  function showToast(msg) { setToast(msg); setTimeout(()=>setToast(""),2500); }
  function handleAdd(data) { setLogs(p=>[Object.assign({id:Date.now()},data),...p]); showToast("✓ 記録しました"); }
  function handleEdit(data) { setLogs(p=>p.map(l=>l.id===editingId?Object.assign({},l,data):l)); setEditingId(null); showToast("✓ 更新しました"); }
  function handleDelete(id) { setLogs(p=>p.filter(l=>l.id!==id)); setDeleteId(null); showToast("削除しました"); }
  const grouped = logs.reduce((acc,l)=>{ acc[l.date]=acc[l.date]||[]; acc[l.date].push(l); return acc; },{});
  const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
  const editingLog = editingId ? logs.find(l=>l.id===editingId) : null;
  return (
    <div style={{ padding:"32px 20px", position:"relative" }}>
      {toast && <div style={{ position:"fixed", top:52, left:"50%", transform:"translateX(-50%)", background:GOLD, color:"#000", padding:"8px 20px", borderRadius:20, fontSize:12, fontWeight:700, zIndex:999 }}>{toast}</div>}
      {deleteId && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"#1a1a1a", border:`1px solid ${BORDER}`, borderRadius:14, padding:"28px 24px", width:280, textAlign:"center" }}>
            <div style={{ fontSize:16, fontWeight:800, color:"white", marginBottom:8 }}>削除しますか？</div>
            <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginBottom:24 }}>この記録は元に戻せません</div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={()=>setDeleteId(null)} style={{ flex:1, padding:"12px", background:"transparent", border:`1px solid ${BORDER}`, borderRadius:8, color:"rgba(255,255,255,0.5)", fontSize:13, fontWeight:700, cursor:"pointer" }}>キャンセル</button>
              <button onClick={()=>handleDelete(deleteId)} style={{ flex:1, padding:"12px", background:"#c0392b", border:"none", borderRadius:8, color:"white", fontSize:13, fontWeight:800, cursor:"pointer" }}>削除</button>
            </div>
          </div>
        </div>
      )}
      {editingId && editingLog && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:1000, overflowY:"auto" }}>
          <div style={{ background:"#141414", minHeight:"100%", padding:"28px 20px", maxWidth:480, margin:"0 auto" }}>
            <div style={{ fontSize:10, letterSpacing:"0.15em", color:GOLD, fontWeight:700, marginBottom:12 }}>EDIT</div>
            <h2 style={{ fontSize:22, fontWeight:800, color:"white", margin:"0 0 24px" }}>記録を編集</h2>
            <RecordForm initial={editingLog} onSave={handleEdit} onCancel={()=>setEditingId(null)} submitLabel="更新する"/>
          </div>
        </div>
      )}
      <div style={{ fontSize:10, letterSpacing:"0.15em", color:GOLD, fontWeight:700, marginBottom:12 }}>RECORD</div>
      <h2 style={{ fontSize:24, fontWeight:800, color:"white", margin:"0 0 24px", letterSpacing:"-0.02em" }}>学習記録</h2>
      <RecordForm onSave={handleAdd} submitLabel="記録する"/>
      {dates.length > 0 && (
        <div>
          <div style={{ height:1, background:BORDER, margin:"32px 0 24px" }}/>
          <div style={{ fontSize:10, letterSpacing:"0.15em", color:"rgba(255,255,255,0.3)", fontWeight:700, marginBottom:16 }}>HISTORY</div>
          {dates.map(date=>(
            <div key={date} style={{ marginBottom:18 }}>
              <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)", letterSpacing:"0.1em", marginBottom:8 }}>{date} · {fmtH(grouped[date].reduce((a,l)=>a+l.minutes,0))}</div>
              {grouped[date].map(l=>(
                <div key={l.id} style={{ border:`1px solid ${BORDER}`, borderRadius:8, padding:"12px 14px", marginBottom:6, display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ marginBottom:3 }}><Tag color={l.category==="基礎学習"?GOLD:"rgba(255,255,255,0.4)"}>{l.subject}</Tag></div>
                    <div style={{ fontSize:18, fontWeight:800, color:"white", letterSpacing:"-0.5px", lineHeight:1 }}>{fmtH(l.minutes)}</div>
                    {l.note && <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{l.note}</div>}
                  </div>
                  <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                    <button onClick={()=>setEditingId(l.id)} style={{ padding:"7px 13px", background:"rgba(201,168,76,0.1)", border:`1px solid rgba(201,168,76,0.25)`, borderRadius:6, color:GOLD, fontSize:11, fontWeight:700, cursor:"pointer" }}>編集</button>
                    <button onClick={()=>setDeleteId(l.id)} style={{ padding:"7px 10px", background:"rgba(192,57,43,0.1)", border:`1px solid rgba(192,57,43,0.25)`, borderRadius:6, color:"#e74c3c", fontSize:11, fontWeight:700, cursor:"pointer" }}>削除</button>
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PageReport({ logs }) {
  const [tab, setTab] = useState("daily");
  const tabs = [{key:"yearly",label:"YEARLY"},{key:"monthly",label:"MONTHLY"},{key:"weekly",label:"WEEKLY"},{key:"daily",label:"DAILY"}];
  function renderPeriods() {
    const keyFns = { daily:l=>l.date, weekly:l=>getWeekKey(l.date), monthly:l=>getMonthKey(l.date), yearly:l=>getYearKey(l.date) };
    const g = groupLogs(logs, keyFns[tab]);
    const keys = Object.keys(g).sort((a,b)=>b.localeCompare(a));
    if(!keys.length) return <div style={{ color:"rgba(255,255,255,0.2)", fontSize:13, textAlign:"center", padding:"60px 0" }}>まだ記録がありません</div>;
    return keys.map((k,i)=>{
      const mins=g[k].reduce((a,l)=>a+l.minutes,0);
      let label=k, sublabel=g[k].length+"件";
      if(tab==="weekly"){ const end=new Date(k); end.setDate(end.getDate()+6); sublabel="〜 "+end.toISOString().slice(0,10)+" · "+g[k].length+"件"; label="Week of "+k; }
      return <PeriodCard key={k} label={label} sublabel={sublabel} mins={mins} logs={g[k]} defaultOpen={i===0}/>;
    });
  }
  return (
    <div style={{ padding:"32px 20px" }}>
      <div style={{ fontSize:10, letterSpacing:"0.15em", color:GOLD, fontWeight:700, marginBottom:12 }}>REPORT</div>
      <h2 style={{ fontSize:24, fontWeight:800, color:"white", margin:"0 0 20px", letterSpacing:"-0.02em" }}>学習レポート</h2>
      <div style={{ display:"flex", gap:4, marginBottom:20, background:SURFACE, borderRadius:8, padding:4 }}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} style={{ flex:1, padding:"8px 0", border:"none", borderRadius:6, background:tab===t.key?GOLD:"transparent", color:tab===t.key?"#000":"rgba(255,255,255,0.3)", fontSize:9, fontWeight:800, letterSpacing:"0.07em", cursor:"pointer" }}>{t.label}</button>
        ))}
      </div>
      {renderPeriods()}
    </div>
  );
}
